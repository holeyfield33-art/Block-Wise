name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check blockwise tests
      - name: Install Playwright for the Studio browser test
        run: |
          npm install -g playwright@1.58.2
          npx -y playwright@1.58.2 install --with-deps chromium
      - run: pytest -q

